[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heat3d-ext-r6"
version = "0.7.0"
description = "Rainbow Six Siege Match Replays (.rec) into the tables the 3DHeat viewer reads"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Holdi601" }]
requires-python = ">=3.10"
dependencies = ["pyarrow>=15", "numpy>=1.24", "zstandard>=0.22"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
heat3d-r6-replay = "heat3d_ext_r6.cli:main"

[tool.setuptools]
packages = ["heat3d_ext_r6", "heat3d_ext_r6.app"]

[tool.setuptools.package-data]
heat3d_ext_r6 = ["catalog.json", "sites.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local: checks against real replays on this machine; skipped where they are absent"]
